name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  server:
    name: Standalone server payload
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # The same gates the Docker build stage runs: build → curate → offline
      # provider init → boot the packaged server and probe its GET surface.
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/smoke-server.mjs

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (the build stage runs the payload gates)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: learnharness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the container and probe the API
        run: |
          set -euo pipefail
          docker run -d --name lh -p 3000:3000 -e LH_ACCESS_PASSWORD=ci-secret learnharness:ci
          for i in $(seq 1 40); do
            if curl -fsS -u learnharness:ci-secret http://127.0.0.1:3000/api/settings >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS -u learnharness:ci-secret http://127.0.0.1:3000/api/models | head -c 400; echo
          # The gate denies without credentials.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/models)
          test "$code" = "401"
          docker logs lh | tail -20
          docker rm -f lh
